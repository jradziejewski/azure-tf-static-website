name: 'Azure Terraform CI/CD'

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 'Deploy and Test'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:

      # 1. Checkout the repository code
      - name: 'Checkout Code'
        uses: actions/checkout@v3

      # 2. Run tfsec Security Scan
      - name: 'Run tfsec Security Scan'
        uses: aquasecurity/tfsec-action@v1.0.0

      # 3. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      #4. Setup Terraform
      - name: 'Terraform Setup'
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      #5. Terraform Init and Apply
      - name: 'Terraform Init'
        run: terraform init

      - name: 'Terraform Apply'
        run: terraform apply -auto-approve

      - name: 'Setup Python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: 'Package API'
        run: |
          cd api
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python-packages/lib/site-packages"
        
      - name: 'Set Function App Name'
        run: |
          FN_NAME=$(terraform output -raw function_app_name)
          echo "FUNCTION_APP_NAME=$FN_NAME" >> $GITHUB_ENV
        
      - name: 'Deploy API to Azure Function App'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: './api'
        env:
          FUNCTION_APP_NAME: ${{ env.FUNCTION_APP_NAME }}

      - name: 'Run Integration Tests'
        run: |
          echo "🧪 Running automated integration tests..."

          WEBSITE_URL=$(terraform output -raw website_url)

          # Test A: Check if HTTP status is 200
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$WEBSITE_URL")
          if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Test A Passed: HTTP status is 200"
          else
              echo "❌ Test A Failed: HTTP status is $HTTP_STATUS"
              exit 1
          fi

          # Test B: Check if the content contains a specific string
          EXPECTED_STRING="Hello Azure!"
          ACTUAL_CONTENT=$(curl -s "$WEBSITE_URL")

          if [[ "$ACTUAL_CONTENT" == *"$EXPECTED_STRING"* ]]; then
              echo "✅ Test B Passed: Content contains the expected string"
          else
              echo "❌ Test B Failed: Content does not contain the expected string"
              exit 1
          fi

          echo "==============================================================="
          echo "🎉 All tests passed! Your static website is live and functioning correctly."
          echo "==============================================================="